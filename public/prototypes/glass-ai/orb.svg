<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <radialGradient id="body"><stop stop-color="#122947" stop-opacity=".22"/><stop offset=".72" stop-color="#16192F" stop-opacity=".45"/><stop offset="1" stop-color="#8DADFF" stop-opacity=".3"/></radialGradient>
    <linearGradient id="rim" x1="36" y1="30" x2="198" y2="216" gradientUnits="userSpaceOnUse"><stop stop-color="#ADFAFF"/><stop offset=".32" stop-color="#5288FF"/><stop offset=".65" stop-color="#C797FF"/><stop offset="1" stop-color="#FFAFD8"/></linearGradient>
    <linearGradient id="flow" x1="40" y1="75" x2="194" y2="170" gradientUnits="userSpaceOnUse"><stop stop-color="#39D8FA"/><stop offset=".48" stop-color="#6D8CFF"/><stop offset="1" stop-color="#FF70BB"/></linearGradient>
    <radialGradient id="shine"><stop stop-color="#D2F9FF" stop-opacity=".7"/><stop offset="1" stop-color="#B4E7FF" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
